<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservAI - Recuperar contraseña</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/Styles.css">
  <link rel="stylesheet" href="/static/estilos/buttonLoading.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box login-box--narrow">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>
      <h2>Recuperar contraseña</h2>
      <p class="form-intro">
        Escribe el correo de tu cuenta y te enviamos las instrucciones para
        restablecer tu contraseña.
      </p>
      <form id="forgotForm" novalidate>
        <div class="input-group">
          <input type="email" id="email" placeholder=" " autocomplete="email"
                 autocapitalize="none" spellcheck="false">
          <label for="email">Correo electrónico</label>
        </div>
        <p class="field-error" id="emailError" role="alert"></p>

        <button type="submit" class="loginbtn">Enviar instrucciones</button>
      </form>
      <p id="formMessage" class="form-message" role="status"></p>
      <p class="terms"><a href="/login">Volver al inicio de sesión</a></p>
    </div>
  </div>
  <script type="module" src="/static/Scripts/forgotPassword.js"></script>
</body>
</html>
