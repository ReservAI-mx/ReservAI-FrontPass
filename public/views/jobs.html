<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReservAI - Jobs</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/StylesInicio.css" />
  <link rel="stylesheet" href="/static/estilos/StylesInvitations.css" />
  <link rel="stylesheet" href="/static/estilos/StylesUI.css" />
  <link rel="stylesheet" href="/static/estilos/StylesTenants.css" />
  <link rel="stylesheet" href="/static/estilos/StylesJobs.css" />
  <link rel="stylesheet" href="/static/estilos/buttonLoading.css" />
</head>
<body class="ui-page">
  <div id="messageContainer" class="message-container"></div>

  <nav class="navbar">
    <div class="logo">
      <img src="/static/Images/ReservAiLogo.png" alt="ReservAI logo" class="logo-img">
      <span class="logo-text">ReservAI Admin</span>
    </div>
    <div class="profile">
      <button class="profile-btn" id="profileBtn" aria-haspopup="true"
              aria-expanded="false" aria-label="Menú de cuenta">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.5" r="3.75"/>
            <path d="M4.5 20.25c0-3.6 3.36-6.25 7.5-6.25s7.5 2.65 7.5 6.25"/>
          </svg>
        </span>
      </button>
      <div class="dropdown" role="menu">
        <p class="dropdown__account" id="accountName"></p>
        <a href="/inicioAdmin" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.25" y="10.25" width="15.5" height="9.5" rx="2.25"/>
            <path d="M8 10.25V7.5a4 4 0 0 1 8 0v2.75"/>
          </svg>
          Gestión de cuentas
        </a>
        <a href="/admin/tenants" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
            <path d="M8 9h8M8 12.5h8M8 16h5"/>
          </svg>
          Tenants
        </a>
        <a href="/admin/jobs" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7h15M4.5 12h15M4.5 17h10"/>
          </svg>
          Jobs
        </a>
        <a href="/admin/traces" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7h15M4.5 12h15M4.5 17h10"/>
          </svg>
          Traces
        </a>
        <a href="/invitations" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.75" y="5.25" width="18.5" height="13.5" rx="2.25"/>
            <path d="m3.5 7 8.5 6 8.5-6"/>
          </svg>
          Invitaciones
        </a>
        <a href="/admin/products" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7.5 12 3.75 19.5 7.5 12 11.25 4.5 7.5z"/>
            <path d="M4.5 12 12 15.75 19.5 12M4.5 16.5 12 20.25 19.5 16.5"/>
          </svg>
          Productos
        </a>
        <a href="/bitacora/" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 3.75h9.5L19 7.25v13H6z"/><path d="M9 11h7M9 14.5h7M9 18h4"/>
          </svg>
          Bitácora de visitas
        </a>
        <a href="/documentacion/" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="4" width="7" height="5" rx="1.2"/><rect x="13.5" y="15" width="7" height="5" rx="1.2"/>
            <path d="M7 9v4.5h10V15"/>
          </svg>
          Documentación
        </a>
        <a href="/tickets/" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v2a2.5 2.5 0 0 0 0 5v2a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2v-2a2.5 2.5 0 0 0 0-5z"/>
            <path d="M14 5.5v13" stroke-dasharray="2 2"/>
          </svg>
          Tickets
        </a>
        <a href="#" id="logout" role="menuitem" class="dropdown__danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4.75H6.75A2 2 0 0 0 4.75 6.75v10.5a2 2 0 0 0 2 2h7.75"/>
            <path d="M17.5 15.25 20.75 12 17.5 8.75"/><path d="M20.25 12H10"/>
          </svg>
          Cerrar sesión
        </a>
      </div>
    </div>
  </nav>

  <main class="container">
    <a class="volver" href="/inicioAdmin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 6.5 9 12l5.5 5.5"/>
      </svg>
      Volver a cuentas
    </a>

    <header class="ui-head">
      <div class="ui-head__titulo">
        <span class="ui-head__icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 7h15M4.5 12h15M4.5 17h10"/><path d="m17 16 2 2 3-3.5"/>
          </svg>
        </span>
        <div>
          <h2>Jobs <span class="count-badge" id="totalJobs" hidden></span></h2>
          <p class="ui-head__sub">Tareas en segundo plano del worker: provisión, renovaciones y avisos de pago</p>
        </div>
      </div>
      <div class="ui-head__acciones">
        <span class="ui-updated" id="updatedLabel"></span>
        <button type="button" class="ui-live" id="liveBtn" aria-pressed="false"
                title="Actualizar automáticamente cada 15 segundos">
          <span class="ui-live__punto" aria-hidden="true"></span>
          En vivo
        </button>
        <button type="button" class="ui-icon-btn" id="reloadBtn" aria-label="Recargar" title="Recargar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- KPIs: también son el filtro por estado -->
    <div class="ui-kpis" id="kpis">
      <button type="button" class="ui-kpi ui-kpi--error" data-status="failed,dead" aria-pressed="false">
        <span class="ui-kpi__label"><span class="ui-dot" aria-hidden="true"></span>Fallidos</span>
        <span class="ui-kpi__num" data-num="failed,dead">—</span>
        <span class="ui-kpi__hint">failed + dead</span>
      </button>
      <button type="button" class="ui-kpi ui-kpi--warning" data-status="queued" aria-pressed="false">
        <span class="ui-kpi__label"><span class="ui-dot" aria-hidden="true"></span>En cola</span>
        <span class="ui-kpi__num" data-num="queued">—</span>
        <span class="ui-kpi__hint">esperando al worker</span>
      </button>
      <button type="button" class="ui-kpi ui-kpi--info" data-status="in_flight" aria-pressed="false">
        <span class="ui-kpi__label"><span class="ui-dot" aria-hidden="true"></span>En vuelo</span>
        <span class="ui-kpi__num" data-num="in_flight">—</span>
        <span class="ui-kpi__hint">ejecutándose ahora</span>
      </button>
      <button type="button" class="ui-kpi ui-kpi--ok" data-status="succeeded" aria-pressed="false">
        <span class="ui-kpi__label"><span class="ui-dot" aria-hidden="true"></span>OK</span>
        <span class="ui-kpi__num" data-num="succeeded">—</span>
        <span class="ui-kpi__hint">terminados bien</span>
      </button>
      <button type="button" class="ui-kpi ui-kpi--todos" data-status="all" aria-pressed="false">
        <span class="ui-kpi__label">Todos</span>
        <span class="ui-kpi__num" data-num="all">—</span>
        <span class="ui-kpi__hint">cualquier estado</span>
      </button>
    </div>

    <section class="ui-toolbar" aria-label="Filtros">
      <div class="search-field ui-search">
        <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25"/><path d="m15.5 15.5 4 4"/>
        </svg>
        <input id="job-search" type="text" placeholder="Buscar por subdominio, cliente, error o id…"
               aria-label="Buscar jobs" autocapitalize="none" spellcheck="false">
        <kbd class="ui-kbd" aria-hidden="true">/</kbd>
      </div>

      <div class="ui-seg" role="group" aria-label="Filtrar por acción" id="actionSeg">
        <button type="button" class="ui-seg__btn" data-action="all" aria-pressed="true">Cualquier acción</button>
        <button type="button" class="ui-seg__btn" data-action="provision" aria-pressed="false">Provision</button>
        <button type="button" class="ui-seg__btn" data-action="disable_renewal" aria-pressed="false">Disable renewal</button>
        <button type="button" class="ui-seg__btn" data-action="enable_renewal" aria-pressed="false">Enable renewal</button>
        <button type="button" class="ui-seg__btn" data-action="payment_notify" aria-pressed="false">Payment notify</button>
      </div>
    </section>

    <p class="lista-error" id="listaError" role="alert"></p>
    <ul id="job-list" class="tenant-list job-list" aria-live="polite"></ul>

    <div class="pagination" id="job-pagination" hidden>
      <button id="prevJob" type="button" aria-label="Página anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 6.5 9 12l5.5 5.5"/>
        </svg>
      </button>
      <span id="pageinfoJob">Página 1</span>
      <button id="nextJob" type="button" aria-label="Página siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.5 6.5 15 12l-5.5 5.5"/>
        </svg>
      </button>
    </div>
  </main>

  <script type="module" src="/static/Scripts/jobs.js"></script>
</body>
</html>
