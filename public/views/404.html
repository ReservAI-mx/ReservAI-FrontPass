<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - ReservAI</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/Styles.css">
  <link rel="stylesheet" href="/static/estilos/StylesStatus.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box status-box">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>

      <span class="status-icono" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="6.25"/><path d="m15.5 15.5 4 4"/><path d="M9 9l4 4M13 9l-4 4"/>
        </svg>
      </span>
      <p class="status-codigo">404</p>
      <h2 class="status-titulo">Página no encontrada</h2>
      <p class="status-msg">La dirección no existe o cambió de lugar. Revisa el enlace o vuelve al inicio.</p>

      <div class="status-acciones">
        <a href="/" class="loginbtn">Ir al inicio</a>
        <button type="button" class="status-secundario" id="backBtn" hidden>Regresar a la página anterior</button>
      </div>
    </div>
  </div>
  <script src="/static/Scripts/notFound.js"></script>
</body>
</html>
