<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservAI - Nueva contraseña</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/static/estilos/Styles.css">
  <link rel="stylesheet" href="/static/estilos/buttonLoading.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box login-box--narrow">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>
      <h2>Nueva contraseña</h2>
      <p class="form-intro">
        Elige una contraseña nueva y confírmala con el código de tu autenticador.
      </p>

      <form id="resetForm" novalidate>
        <div class="input-group password-group">
          <input type="password" id="password" placeholder=" " autocomplete="new-password">
          <label for="password">Nueva contraseña</label>
          <button type="button" class="toggle-password" data-toggle="password"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="field-error" id="passwordError" role="alert"></p>

        <div class="input-group password-group">
          <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password">
          <label for="confirmPassword">Confirmar contraseña</label>
          <button type="button" class="toggle-password" data-toggle="confirmPassword"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="field-error" id="confirmError" role="alert"></p>

        <ul class="password-rules" id="passwordRules">
          <li data-regla="largo">12 caracteres</li>
          <li data-regla="mayus">Una mayúscula</li>
          <li data-regla="minus">Una minúscula</li>
          <li data-regla="numero">Un número</li>
          <li data-regla="simbolo">Un símbolo</li>
        </ul>

        <div class="form-sep"><span>Confirma que eres tú</span></div>

        <div class="input-group">
          <input type="text" id="code" placeholder=" " inputmode="numeric"
                 maxlength="6" autocomplete="one-time-code">
          <label for="code">Código 2FA</label>
        </div>
        <p class="field-error" id="codeError" role="alert"></p>

        <p class="field-error" id="formError" role="alert"></p>
        <button type="submit" class="loginbtn">Guardar</button>
      </form>
      <p class="terms"><a href="/login">Volver al inicio de sesión</a></p>
    </div>
  </div>
  <script type="module" src="/static/Scripts/resetPassword.js"></script>
</body>
</html>
