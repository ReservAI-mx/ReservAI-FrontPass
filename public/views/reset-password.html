<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservAI - Nueva contraseña</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/Styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>
      <h2>Nueva contraseña</h2>
      <form id="resetForm">
        <div class="input-group">
          <input type="password" id="password" placeholder="Nueva contraseña" autocomplete="new-password">
        </div>
        <div class="input-group">
          <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" autocomplete="new-password">
        </div>
        <div class="input-group">
          <input type="text" id="code" placeholder="Código 2FA" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        </div>
        <p class="terms">Mínimo 12 caracteres, mayúscula, minúscula, número y símbolo. Se requiere 2FA activo.</p>
        <p id="formError" class="error"></p>
        <button type="submit" class="loginbtn">Guardar</button>
      </form>
    </div>
  </div>
  <script type="module" src="/static/Scripts/resetPassword.js"></script>
</body>
</html>
