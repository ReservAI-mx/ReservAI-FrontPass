<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReservAI - Inicio</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/StylesInicio.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">
      <img src="/static/Images/ReservAiLogo.png" alt="ReservAI logo" class="logo-img">
      <span class="logo-text">ReservAI</span>
    </div>

    <div class="profile">
      <button class="profile-btn" aria-haspopup="true" aria-expanded="false">
        <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" class="profile-icon" alt="Perfil">
      </button>
      <div class="dropdown" role="menu">
        <a href="#" id="changePasswordLink">Cambiar contraseña</a>
        <a href="#" id="logout">Cerrar sesión</a>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="container">
    <h2>Resumen de Contraseñas</h2>

    <input id="search" type="text" placeholder="Buscar contraseña por nombre..." aria-label="Buscar">

    <ul id="password-list" class="password-list" aria-live="polite"></ul>

    <div class="pagination" style="display:none;">
      <button id="prev" type="button"><</button>
      <span id="page-info">Página 1</span>
      <button id="next" type="button">></button>
    </div>
  </main>

  <!-- FAB -->
  <button class="fab" id="addPasswordBtn" aria-label="Agregar contraseña">+</button>

  <!-- Modal Crear Contraseña -->
<div id="createModal" class="modalcreate">
  <div class="modal-content2">
    <div id="createLoadingOverlay">
      <div style="font-size:1.2em;">⏳ Cargando...</div>
    </div>
    <div class="modal-header2">
      <span class="closecreate" data-close="createModal" aria-label="Cerrar">&times;</span>
    <h2>Crear Contraseña</h2>
    </div>

    <input type="text" id="createName" placeholder="Nombre de la contraseña">

    <div class="password-field2">
      <input type="password" id="createPassword" placeholder="Contraseña">
      <button type="button" id="toggleCreatePassword"><i class="fas fa-eye"></i></button>
    </div>

    <div class="password-field2">
      <input type="password" id="confirmPassword" placeholder="Confirmar contraseña">
      <button type="button" id="toggleConfirmPassword"><i class="fas fa-eye"></i></button>
    </div>

    <textarea id="createDescription" placeholder="Descripción (opcional)" rows="3"></textarea>

    <p class="error-message" id="msg" aria-live="assertive"></p>
    <div class="modal-actions2">
    <button id="savePasswordBtn" class="close-btn">Guardar</button>
    </div>
  </div>
</div>

 <!-- Modal Ver Contraseña -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <!-- Header con botón de cerrar -->
            <div class="modal-header">
                <h2>Ver Contraseña</h2>
                <span class="close" data-close="viewModal" aria-label="Cerrar">&times;</span>
            </div>

            <!-- Body dinámico -->
            <div class="modal-body" id="modalBody">
                <!-- El contenido se llena dinámicamente -->
            </div>
            <!-- Footer con botón de cerrar -->
            <div class="modal-footer">
                <button class="close-btn" data-close="viewModal">Cerrar</button>
            </div>
        </div>

        </div>
    </div>



  <div id="changePasswordModal" class="modalcreate">
    <div class="modal-content2">
      <div class="modal-header2">
        <span class="closecreate" data-close="changePasswordModal" aria-label="Cerrar">&times;</span>
        <h2>Cambiar contraseña</h2>
      </div>
      <form id="changePasswordForm">
        <input type="password" id="currentPassword" placeholder="Contraseña actual" autocomplete="current-password">
        <input type="password" id="newPassword" placeholder="Nueva contraseña" autocomplete="new-password">
        <input type="password" id="confirmNewPassword" placeholder="Confirmar nueva contraseña" autocomplete="new-password">
        <p class="error-message" id="changePasswordError"></p>
        <div class="modal-actions2">
          <button type="submit" class="close-btn">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/static/Scripts/inicioScript/Inicio.js"></script>
</body>
</html>
