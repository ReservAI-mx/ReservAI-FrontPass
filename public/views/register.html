<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservAI - Invitar</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/static/estilos/Stylessregister.css">
</head>
<body>
  <div id="messageContainer" class="message-container"></div>

  <div class="login-container">
    <div class="login-box">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>

      <h2>Invitar usuario</h2>
      <p class="terms">Se enviará un correo con el enlace para crear la cuenta.</p>

      <input type="email" id="email" placeholder="Correo electrónico">

      <div class="account-type">
        <label for="accountType">Tipo de cuenta</label>
        <label class="switch">
          <input type="checkbox" id="accountType">
          <span class="slider"></span>
        </label>
        <span id="accountLabel">Cliente</span>
      </div>

      <button id="registerBtn" class="btn">Enviar invitación</button>
      <p class="terms"><a href="/inicioAdmin">Volver</a></p>
    </div>
  </div>
  <script type="module" src="/static/Scripts/register.js"></script>
</body>
</html>
