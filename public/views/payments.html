<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReservAI - Historial de cobros</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/StylesBilling.css" />
  <link rel="stylesheet" href="/static/estilos/StylesFiscal.css" />
  <link rel="stylesheet" href="/static/estilos/StylesPayments.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <nav class="navbar">
    <div class="logo">
      <img src="/static/Images/ReservAiLogo.png" alt="ReservAI logo" class="logo-img">
      <span class="logo-text">ReservAI</span>
    </div>

    <div class="profile">
      <button class="profile-btn" id="profileBtn" aria-haspopup="true"
              aria-expanded="false" aria-label="Menú de cuenta">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.5" r="3.75"/>
            <path d="M4.5 20.25c0-3.6 3.36-6.25 7.5-6.25s7.5 2.65 7.5 6.25"/>
          </svg>
        </span>
      </button>
      <div class="dropdown" role="menu">
        <p class="dropdown__account" id="accountName"></p>
        <a href="/inicio" id="inicioLink" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.25" y="10.25" width="15.5" height="9.5" rx="2.25"/>
            <path d="M8 10.25V7.5a4 4 0 0 1 8 0v2.75"/>
          </svg>
          Mis contraseñas
        </a>
        <a href="/billing" id="billingLink" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.75" y="5.25" width="18.5" height="13.5" rx="2.25"/>
            <path d="M2.75 9.75h18.5"/><path d="M6.5 14.75h3.5"/>
          </svg>
          Facturación
        </a>
        <a href="/fiscal" id="fiscalLink" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 4.75h10A2.25 2.25 0 0 1 19.25 7v10A2.25 2.25 0 0 1 17 19.25H7A2.25 2.25 0 0 1 4.75 17V7A2.25 2.25 0 0 1 7 4.75z"/>
            <path d="M8.5 9.5h7"/><path d="M8.5 12.5h7"/><path d="M8.5 15.5h4"/>
          </svg>
          Información fiscal
        </a>
        <a href="#" id="logout" role="menuitem" class="dropdown__danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4.75H6.75A2 2 0 0 0 4.75 6.75v10.5a2 2 0 0 0 2 2h7.75"/>
            <path d="M17.5 15.25 20.75 12 17.5 8.75"/><path d="M20.25 12H10"/>
          </svg>
          Cerrar sesión
        </a>
      </div>
    </div>
  </nav>

  <main class="container fiscal-page payments-page">
    <a class="volver" href="/inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 6.5 9 12l5.5 5.5"/>
      </svg>
      Volver
    </a>

    <div class="billing-header">
      <div class="billing-info">
        <h1>Historial de cobros</h1>
        <p class="billing-description">
          Descarga tickets Stripe y facturas CFDI. Solo puedes solicitar factura
          en el mes del cobro (hora Ciudad de México).
        </p>
      </div>
    </div>

    <div id="paymentsLoading" class="fiscal-status" hidden>Cargando…</div>
    <div id="paymentsError" class="fiscal-status fiscal-status--error" hidden></div>
    <div id="paymentsMessage" class="fiscal-status fiscal-status--ok" hidden></div>

    <section class="fiscal-card payments-card">
      <div id="paymentsEmpty" class="payments-empty" hidden>No hay cobros registrados.</div>
      <div class="payments-table-wrap">
        <table class="payments-table" id="paymentsTable" hidden>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="paymentsBody"></tbody>
        </table>
      </div>
      <div class="payments-pager" id="paymentsPager" hidden>
        <button type="button" id="paymentsPrev" class="btn-secondary">Anterior</button>
        <span id="paymentsPageInfo"></span>
        <button type="button" id="paymentsNext" class="btn-secondary">Siguiente</button>
      </div>
    </section>
  </main>

  <script type="module" src="/static/Scripts/payments.js"></script>
</body>
</html>
