<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ReservAI - Traces</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/StylesInicio.css" />
  <link rel="stylesheet" href="/static/estilos/StylesInvitations.css" />
  <link rel="stylesheet" href="/static/estilos/StylesTenants.css" />
  <link rel="stylesheet" href="/static/estilos/StylesJobs.css" />
  <link rel="stylesheet" href="/static/estilos/StylesTraces.css" />
  <link rel="stylesheet" href="/static/estilos/buttonLoading.css" />
</head>
<body class="traces-page">
  <div id="messageContainer" class="message-container"></div>

  <nav class="navbar">
    <div class="logo">
      <img src="/static/Images/ReservAiLogo.png" alt="ReservAI logo" class="logo-img">
      <span class="logo-text">ReservAI Admin</span>
    </div>
    <div class="profile">
      <button class="profile-btn" id="profileBtn" aria-haspopup="true"
              aria-expanded="false" aria-label="Menú de cuenta">
        <span class="profile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8.5" r="3.75"/>
            <path d="M4.5 20.25c0-3.6 3.36-6.25 7.5-6.25s7.5 2.65 7.5 6.25"/>
          </svg>
        </span>
      </button>
      <div class="dropdown" role="menu">
        <p class="dropdown__account" id="accountName"></p>
        <a href="/inicioAdmin" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4.25" y="10.25" width="15.5" height="9.5" rx="2.25"/>
            <path d="M8 10.25V7.5a4 4 0 0 1 8 0v2.75"/>
          </svg>
          Gestión de cuentas
        </a>
        <a href="/admin/tenants" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="4.5" width="17" height="15" rx="2"/>
            <path d="M8 9h8M8 12.5h8M8 16h5"/>
          </svg>
          Tenants
        </a>
        <a href="/admin/jobs" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7h15M4.5 12h15M4.5 17h10"/>
          </svg>
          Jobs
        </a>
        <a href="/admin/traces" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7h15M4.5 12h15M4.5 17h10"/>
          </svg>
          Traces
        </a>
        <a href="/invitations" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2.75" y="5.25" width="18.5" height="13.5" rx="2.25"/>
            <path d="m3.5 7 8.5 6 8.5-6"/>
          </svg>
          Invitaciones
        </a>
        <a href="/admin/products" role="menuitem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.5 7.5 12 3.75 19.5 7.5 12 11.25 4.5 7.5z"/>
            <path d="M4.5 12 12 15.75 19.5 12M4.5 16.5 12 20.25 19.5 16.5"/>
          </svg>
          Productos
        </a>
        <a href="#" id="logout" role="menuitem" class="dropdown__danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14.5 4.75H6.75A2 2 0 0 0 4.75 6.75v10.5a2 2 0 0 0 2 2h7.75"/>
            <path d="M17.5 15.25 20.75 12 17.5 8.75"/><path d="M20.25 12H10"/>
          </svg>
          Cerrar sesión
        </a>
      </div>
    </div>
  </nav>

  <main class="container">
    <a class="volver" href="/inicioAdmin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 6.5 9 12l5.5 5.5"/>
      </svg>
      Volver a cuentas
    </a>

    <div class="page-head">
      <h2>Traces</h2>
      <span class="count-badge" id="totalTraces" hidden></span>
      <button type="button" class="btn-reload" id="reloadBtn">Recargar</button>
    </div>

    <div class="filtros" role="group" aria-label="Filtrar por nivel">
      <button type="button" class="filtro filtro--todos" data-level="" aria-pressed="true">
        <span class="filtro__punto" aria-hidden="true"></span>Todos
      </button>
      <button type="button" class="filtro filtro--info" data-level="info" aria-pressed="false">
        <span class="filtro__punto" aria-hidden="true"></span>Info
      </button>
      <button type="button" class="filtro filtro--warning" data-level="warning" aria-pressed="false">
        <span class="filtro__punto" aria-hidden="true"></span>Warning
      </button>
      <button type="button" class="filtro filtro--error" data-level="error" aria-pressed="false">
        <span class="filtro__punto" aria-hidden="true"></span>Error
      </button>
    </div>

    <div class="filtros filtros--resolution" role="group" aria-label="Filtrar por resolución">
      <button type="button" class="filtro" data-resolution="" aria-pressed="true">Todos</button>
      <button type="button" class="filtro" data-resolution="open" aria-pressed="false">Abiertos</button>
      <button type="button" class="filtro" data-resolution="resolved" aria-pressed="false">Resueltos</button>
    </div>

    <div class="filter-row">
      <div class="search-field">
        <svg class="search-field__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="6.25"/><path d="m15.5 15.5 4 4"/>
        </svg>
        <input id="serviceFilter" type="text" value=""
               placeholder="Servicio (vacío = todos)…"
               aria-label="Filtrar por servicio" autocapitalize="none" spellcheck="false">
      </div>
      <label class="date-field">
        <span>Rango</span>
        <select id="rangePreset" aria-label="Rango de tiempo">
          <option value="1h">Última hora</option>
          <option value="6h">Últimas 6 horas</option>
          <option value="today" selected>Hoy</option>
          <option value="24h">Últimas 24 horas</option>
          <option value="7d">Última semana</option>
          <option value="30d">Últimos 30 días</option>
          <option value="custom">Personalizado…</option>
          <option value="all">Todo</option>
        </select>
      </label>
      <label class="date-field date-field--custom" id="fromWrap" hidden>
        <span>Desde</span>
        <input id="fromDate" type="datetime-local" aria-label="Fecha y hora desde">
      </label>
      <label class="date-field date-field--custom" id="toWrap" hidden>
        <span>Hasta</span>
        <input id="toDate" type="datetime-local" aria-label="Fecha y hora hasta">
      </label>
    </div>

    <p class="lista-error" id="listaError" role="alert"></p>

    <div class="layout">
      <section class="panel panel--list" aria-label="Lista de traces">
        <ul id="traceList" class="tenant-list" aria-live="polite"></ul>
        <div class="pager" id="pager" hidden>
          <button type="button" class="btn-pager" id="prevPage">Anterior</button>
          <span class="pager__label" id="pagerLabel"></span>
          <button type="button" class="btn-pager" id="nextPage">Siguiente</button>
        </div>
      </section>
      <section class="panel panel--detail" id="detailPanel" aria-label="Detalle del trace">
        <p class="detail-placeholder" id="detailPlaceholder">Selecciona un trace</p>
        <div id="detailContent" hidden></div>
      </section>
    </div>
  </main>

  <script type="module" src="/static/Scripts/traces.js"></script>
</body>
</html>
