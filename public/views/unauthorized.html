<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin acceso - ReservAI</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="/static/estilos/Styles.css">
  <link rel="stylesheet" href="/static/estilos/StylesStatus.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box status-box">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>

      <span class="status-icono status-icono--danger" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.25" y="10.25" width="15.5" height="9.5" rx="2.25"/>
          <path d="M8 10.25V7.5a4 4 0 0 1 8 0v2.75"/><path d="M12 14v2.25"/>
        </svg>
      </span>
      <h2 class="status-titulo">No tienes acceso a este negocio</h2>
      <p class="status-msg">Por seguridad cerramos tu sesión. Entra de nuevo con una cuenta que tenga permiso.</p>

      <div class="status-acciones">
        <a href="/login" class="loginbtn" id="backLink">Ir al login</a>
      </div>

      <p class="status-cuenta" id="cuentaTexto" aria-live="polite">Te llevamos al login en 3 s…</p>
      <div class="status-barra" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <script src="/static/Scripts/unauthorized.js"></script>
</body>
</html>
