<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReservAI - Aceptar invitación</title>
  <link rel="icon" type="image/x-icon" href="/static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/static/estilos/Styles.css">
  <link rel="stylesheet" href="/static/estilos/buttonLoading.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box login-box--narrow">
      <div class="logo">
        <img src="/static/Images/ReservAiLogo.png" alt="ReservAI Logo">
        <h1>ReservAI</h1>
      </div>
      <h2>Crear tu cuenta</h2>
      <p class="form-intro">
        Elige tu nombre y una contraseña para terminar de activar tu cuenta.
      </p>

      <form id="acceptForm" novalidate>
        <div class="input-group">
          <input type="text" id="name" placeholder=" " autocomplete="name">
          <label for="name">Nombre</label>
        </div>
        <p class="field-error" id="nameError" role="alert"></p>

        <div class="input-group password-group">
          <input type="password" id="password" placeholder=" " autocomplete="new-password">
          <label for="password">Contraseña</label>
          <button type="button" class="toggle-password" data-toggle="password"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="field-error" id="passwordError" role="alert"></p>

        <!-- Cuánto falta -->
        <div class="password-progress" id="passwordProgress" data-nivel="0">
          <div class="password-progress__barra" role="progressbar"
               aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"
               aria-label="Requisitos de la contraseña cumplidos">
            <span class="password-progress__relleno"></span>
          </div>
          <p class="password-progress__texto" id="passwordProgressTexto" aria-live="polite">
            Escribe una contraseña
          </p>
        </div>

        <!-- Qué falta -->
        <ul class="password-rules" id="passwordRules"></ul>

        <p class="password-hint">
          Símbolos válidos: <code id="simbolosPermitidos"></code>
        </p>

        <div class="input-group password-group input-group--separado">
          <input type="password" id="confirmPassword" placeholder=" " autocomplete="new-password">
          <label for="confirmPassword">Confirmar contraseña</label>
          <button type="button" class="toggle-password" data-toggle="confirmPassword"
                  aria-label="Mostrar contraseña">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <p class="match-hint" id="matchHint" aria-live="polite"></p>

        <p class="field-error" id="formError" role="alert"></p>
        <button type="submit" class="loginbtn" id="crearBtn" disabled>Crear cuenta</button>
      </form>
    </div>
  </div>
  <script type="module" src="/static/Scripts/acceptInvitation.js"></script>
</body>
</html>
