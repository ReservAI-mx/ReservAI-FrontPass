<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación - ReservAI</title>
  <link rel="icon" type="image/x-icon" href="static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="static/estilos/StyleTwoFa.css">
</head>
<body>
  <div class="verify-container">
    <div class="logo">
      <img src="static/Images/ReservAiLogo.png" alt="ReservAI Logo">
      <h1>ReservAI</h1>
    </div>

    <p class="instruction">
      Ingresa los <span>6 números</span> de tu aplicación de doble autenticación
    </p>

    <div class="code-inputs">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
    </div>
    <p id="twofa-error" class="twofa-error"></p> 

    <button class="btn-verify">Verificar</button>
    <p class="recovery-link"><button type="button" id="lostAuthenticatorBtn" class="link-btn">Perdí el autenticador</button></p>
    <div id="recoveryPanel" class="recovery-panel" hidden>
      <p>Sube el documento de recuperación que descargaste al activar 2FA.</p>
      <input type="file" id="recoveryFile" accept="application/json,.json">
      <button type="button" id="recoverySubmit" class="btn-verify">Desactivar 2FA</button>
    </div>
  </div>

  <script type="module" src="static/Scripts/twofa.js"></script>

</body>
</html>
