<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Verificación - ReservAI</title>
  <link rel="icon" type="image/x-icon" href="static/Images/ReservAiLogo.png" />
  <link rel="stylesheet" href="static/estilos/StyleTwoFa.css">
  <link rel="stylesheet" href="static/estilos/buttonLoading.css">
</head>
<body>
  <div class="verify-container">
    <div class="logo">
      <img src="static/Images/ReservAiLogo.png" alt="ReservAI Logo">
      <h1>ReservAI</h1>
    </div>

    <p class="instruction">
      Ingresa los <span>6 números</span> de tu aplicación de doble autenticación
    </p>

    <div class="code-inputs">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
      <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric">
    </div>
    <p id="twofa-error" class="twofa-error"></p> 

    <button class="btn-verify">Verificar</button>
    <p class="recovery-link"><button type="button" id="lostAuthenticatorBtn" class="link-btn">Perdí el autenticador</button></p>
    <div id="recoveryPanel" class="recovery-panel" hidden>
      <p class="recovery-panel__intro">
        Sube el documento de recuperación que descargaste al activar 2FA.
      </p>

      <label class="dropzone" id="recoveryDropzone" for="recoveryFile">
        <input type="file" id="recoveryFile" class="dropzone__input"
               accept="application/json,.json">
        <span class="dropzone__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16.5V4.5"/>
            <path d="m7.5 9 4.5-4.5L16.5 9"/>
            <path d="M4.5 15.75v2.5a1.75 1.75 0 0 0 1.75 1.75h11.5a1.75 1.75 0 0 0 1.75-1.75v-2.5"/>
          </svg>
        </span>
        <span class="dropzone__title">Arrastra el archivo o haz clic para elegirlo</span>
        <span class="dropzone__hint">Documento de recuperación .json</span>
        <span class="dropzone__file" id="recoveryFileName"></span>
      </label>

      <p class="recovery-panel__error" id="recoveryError" role="alert"></p>

      <button type="button" id="recoverySubmit" class="upload-btn" disabled>
        <span class="upload-btn__bar" id="recoveryProgressBar"></span>
        <span class="upload-btn__content">
          <span class="upload-btn__icon" id="recoverySubmitIcon"></span>
          <span class="upload-btn__label" id="recoverySubmitLabel">Desactivar 2FA</span>
        </span>
      </button>
    </div>
  </div>

  <script type="module" src="static/Scripts/twofa.js"></script>

</body>
</html>
